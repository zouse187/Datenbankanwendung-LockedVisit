<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Oracle Demo</title>
</head>
<body>
  <h1>Besucher</h1>
  <pre id="output">Lade...</pre>

  <script>
    fetch("http://localhost:3000/api/besucher")
      .then(r => r.json())
      .then(data => {
        document.getElementById("output").textContent =
          JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById("output").textContent = "Fehler: " + err;
      });
  </script>
</body>
</html>
